version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22

  # build and test abe-sls-core
  pre_build:
    on-failure: ABORT # or CONTINUE
    commands:
      - cd abe-sls-core
      - NODE_ENV=dev npm ci
      - npm run build
      - npm run test
      - cd ..

  build:
    commands:
      # this is just to compile ts; serverless will run its own build at deploy
      - cd aws-deployment
      - NODE_ENV=dev npm ci
      - npm run build

artifacts:
  files:
    - '**/*'
  enable-symlinks: yes
