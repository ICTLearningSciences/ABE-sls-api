version: 0.2

env:
  variables:
    ENV: "prod"
  parameter-store:
    SERVERLESS_ACCESS_KEY: "/shared/serverless-cicd-token"


phases:
  install:
    runtime-versions:
      nodejs: 22

  pre_build:
    commands:
      - cd aws-deployment
  build:
    commands:
      - echo Deploying stack
      - make deploy
